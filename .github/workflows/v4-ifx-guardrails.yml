# DIAGNOSTIC PROBE P0-d2 (IFX amendment A4, Plan 20261002-v4-ifx-a4-specimen-runner-revision, RA2, RA7): NEVER MERGE.
# The published 0.5.2 successor specimen with only the two I2-E E3 corrections (F-E7 installer path inside the release
# archive, F-E6 StateRoot and EvidenceRoot created before composition) and one read-only runner inventory step.
# P0-d2 adds two read-only diagnostic steps after Produce (F-E9, F-E8, F-E1); the revised specimen comes from A4-4.
name: V4 IFX Guardrails

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-ifx-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V4_RELEASE_REPOSITORY: von12549/Guard
  V4_RELEASE_TAG: v4-guards-v1.1.6
  V4_ARCHIVE_NAME: v4-guards-1.1.6.zip
  V4_ARCHIVE_SHA256: 92f1ec54db83de24c9d2096c8da5831b0a50bba0d53b9a4c719ad741f1b392c8
  IFX_BUNDLE_BASE_PATH: docs/guards/v4-adoption/extensions/ifx/0.5.2
  IFX_BUNDLE_MANIFEST_SHA256: a2f619a31c2751949058812d73fdf6a6b6142832c85e772d23a714f40304e372
  IFX_PRODUCTION_REVIEW_SHA256: 38eb775a885996d0ab092dc1f4fe32e600a3fdb0997bce4a018e698eed93e24d
  IFX_TARGET_COMMIT: 3600988cc9e91f0a523ec60f5f4378dd4c83c541
  IFX_EVIDENCE_PRODUCERS: docs/guards/v4-adoption/ci/Invoke-IFXEvidenceProducers.ps1

jobs:
  v4-ifx-contract:
    name: v4-ifx-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Materialize the previously trusted base
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/ifx-trusted-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fetch and verify immutable V4 and IFX inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $input = Join-Path $env:RUNNER_TEMP 'v4-ifx-inputs'
          New-Item -ItemType Directory -Path $input | Out-Null
          gh release download $env:V4_RELEASE_TAG --repo von12549/Guard --pattern $env:V4_ARCHIVE_NAME --dir $input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = Join-Path $input $env:V4_ARCHIVE_NAME
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($archiveHash -cne $env:V4_ARCHIVE_SHA256) { throw 'V4 release archive hash mismatch.' }
          $trusted = Join-Path "$env:RUNNER_TEMP/ifx-trusted-base" $env:IFX_BUNDLE_BASE_PATH
          $manifest = Join-Path $trusted 'bundle/bundle-manifest.json'
          $review = Join-Path $trusted 'production-extension-review.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf) -or -not (Test-Path -LiteralPath $review -PathType Leaf)) {
            throw 'The exact IFX bundle has not been published into the trusted base by its separate authorization.'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -cne $env:IFX_BUNDLE_MANIFEST_SHA256) {
            throw 'IFX bundle manifest hash mismatch.'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $review).Hash.ToLowerInvariant() -cne $env:IFX_PRODUCTION_REVIEW_SHA256) {
            throw 'IFX production review hash mismatch.'
          }
          Copy-Item -LiteralPath $trusted -Destination (Join-Path $input 'ifx-0.5.2') -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: v4-ifx-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/v4-ifx-inputs
          if-no-files-found: error
          retention-days: 1

  v4-ifx-windows:
    name: v4-ifx-windows
    needs: v4-ifx-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Materialize the previously trusted base
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/ifx-trusted-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Runner inventory (A4 P0-d diagnostic, read-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          '== os'; [Environment]::OSVersion.VersionString
          '== docker'; docker version --format 'client {{.Client.Os}}/{{.Client.Arch}} {{.Client.Version}}; server {{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'
          '== dotnet sdks'; dotnet --list-sdks
          '== dotnet runtimes'; dotnet --list-runtimes
          '== node'; node --version; npm --version
          '== sqllocaldb'; if (Get-Command SqlLocalDB -ErrorAction SilentlyContinue) { SqlLocalDB info } else { 'SqlLocalDB not found' }
          '== sql services'; Get-Service -Name 'MSSQL*' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Status)" }
          '== long paths'; (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled; git config --show-origin --get-all core.longpaths
          '== git autocrlf'; git config --show-origin --get-all core.autocrlf
          exit 0
      - uses: actions/download-artifact@v5
        with:
          name: v4-ifx-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/v4-ifx-inputs
      - name: Install and compose the exact trusted inputs outside TargetRoot
        shell: pwsh
        run: |
          $input = Join-Path $env:RUNNER_TEMP 'v4-ifx-inputs'
          $archive = Join-Path $input $env:V4_ARCHIVE_NAME
          $expanded = Join-Path $env:RUNNER_TEMP 'v4-archive'
          $base = Join-Path $env:RUNNER_TEMP 'v4-base-install'
          $baseReceipt = Join-Path $env:RUNNER_TEMP 'v4-base.install.json'
          $composed = Join-Path $env:RUNNER_TEMP 'v4-ifx-composed'
          $composeReceipt = Join-Path $env:RUNNER_TEMP 'v4-ifx.compose.json'
          $state = Join-Path $env:RUNNER_TEMP 'v4-ifx-state'
          $evidence = Join-Path $env:RUNNER_TEMP 'v4-ifx-evidence'
          New-Item -ItemType Directory -Path $state, $evidence | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          pwsh -NoProfile -File (Join-Path $expanded 'v4-guards-1.1.6/package/core/distribution/Install-V4Distribution.ps1') -Mode Install -InstallRoot $base -ReceiptPath $baseReceipt -ArchivePath $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundleBase = Join-Path $input 'ifx-0.5.2'
          pwsh -NoProfile -File (Join-Path $base 'package/core/distribution/Compose-V4Extension.ps1') -BaseInstallRoot $base -BaseReceiptPath $baseReceipt -BaseArchivePath $archive -BundleRoot (Join-Path $bundleBase 'bundle') -ReviewRecordPath (Join-Path $bundleBase 'production-extension-review.json') -OutputInstallRoot $composed -CompositionReceiptPath $composeReceipt -TargetRoot $env:GITHUB_WORKSPACE -StateRoot $state -EvidenceRoot $evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "V4_IFX_COMPOSED=$composed" >> $env:GITHUB_ENV
          "V4_IFX_STATE=$state" >> $env:GITHUB_ENV
          "V4_IFX_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - name: Produce IFX evidence at the PR head (relocated V4 producers)
        shell: pwsh
        run: |
          # The staging script comes from the trusted base; the producer scripts it runs are verified by the lock
          # consumers against the producer hashes pinned in the accepted module policies.
          pwsh -NoProfile -File "$env:RUNNER_TEMP/ifx-trusted-base/$env:IFX_EVIDENCE_PRODUCERS" -Phase Produce -TargetRoot $env:GITHUB_WORKSPACE -RunRecordPath "$env:RUNNER_TEMP/v4-ifx-production.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Producer diagnostics (A4 P0-d2, read-only)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-FailedTests([string] $Root) {
            foreach ($file in @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter '*.trx' -ErrorAction SilentlyContinue)) {
              [xml]$x = Get-Content -Raw -LiteralPath $file.FullName
              $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
              $c = (Select-Xml -Xml $x -XPath '//t:Counters' -Namespace $ns | Select-Object -First 1).Node
              "-- $($file.Name): total $($c.total) passed $($c.passed) failed $($c.failed)"
              foreach ($f in @(Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | Select-Object -First 25)) {
                "FAILED $($f.Node.testName)"
                $m = $f.Node.Output.ErrorInfo.Message; if ($m) { ($m -split "`n" | Select-Object -First 8) -join "`n" }
              }
            }
          }
          $record = Join-Path $env:RUNNER_TEMP 'v4-ifx-production.json'
          '== production record'; if (Test-Path -LiteralPath $record) { Get-Content -Raw -LiteralPath $record } else { 'none' }
          $runs = Join-Path $env:GITHUB_WORKSPACE 'artifacts/guards/v4a-producers'
          '== producer run files'; Get-ChildItem -LiteralPath $runs -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200 | ForEach-Object { "$([IO.Path]::GetRelativePath($runs, $_.FullName)) $($_.Length)" }
          '== quality summaries'
          foreach ($j in @(Get-ChildItem -LiteralPath $runs -Recurse -File -Filter '*.json' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]quality[\\/]' })) { "-- $($j.Name)"; $t = Get-Content -Raw -LiteralPath $j.FullName; $t.Substring(0, [Math]::Min(4000, $t.Length)) }
          '== failed tests'; Show-FailedTests $runs
          if (@(Get-ChildItem -LiteralPath $runs -Recurse -File -Filter '*.trx' -ErrorAction SilentlyContinue).Count -eq 0) {
            '== no TRX file: solution build errors'
            dotnet build (Join-Path $env:GITHUB_WORKSPACE 'IFX.sln') --configuration Release -nologo -clp:ErrorsOnly 2>&1 | Select-Object -Last 80
          }
          exit 0
      - name: Database producer, run independently (A4 P0-d2 diagnostic)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-FailedTests([string] $Root) {
            foreach ($file in @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter '*.trx' -ErrorAction SilentlyContinue)) {
              [xml]$x = Get-Content -Raw -LiteralPath $file.FullName
              $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
              $c = (Select-Xml -Xml $x -XPath '//t:Counters' -Namespace $ns | Select-Object -First 1).Node
              "-- $($file.Name): total $($c.total) passed $($c.passed) failed $($c.failed)"
              foreach ($f in @(Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | Select-Object -First 25)) {
                "FAILED $($f.Node.testName)"
                $m = $f.Node.Output.ErrorInfo.Message; if ($m) { ($m -split "`n" | Select-Object -First 8) -join "`n" }
              }
            }
          }
          $id = [guid]::NewGuid().ToString('N')
          $t = [Diagnostics.Stopwatch]::StartNew()
          $out = @(& pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $env:GITHUB_WORKSPACE 'docs/guards/v4-adoption/producers/database/Invoke-IFXDatabaseEvidenceProducer.ps1') -TargetRoot $env:GITHUB_WORKSPACE -RunId $id 2>&1)
          "== database producer exit $LASTEXITCODE after $([Math]::Round($t.Elapsed.TotalSeconds)) s"
          '== last 60 lines'; $out | Select-Object -Last 60 | ForEach-Object { [string]$_ }
          '== failed tests'; Show-FailedTests (Join-Path $env:GITHUB_WORKSPACE "artifacts/guards/v4a-producers/database-runs/$id")
          exit 0
      - name: Stage IFX evidence into EvidenceRoot
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:RUNNER_TEMP/ifx-trusted-base/$env:IFX_EVIDENCE_PRODUCERS" -Phase Stage -TargetRoot $env:GITHUB_WORKSPACE -RunRecordPath "$env:RUNNER_TEMP/v4-ifx-production.json" -EvidenceRoot $env:V4_IFX_EVIDENCE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run trusted IFX Pre
        shell: pwsh
        run: |
          dotnet "$env:V4_IFX_COMPOSED/host/v4-guards.dll" stage run --stage pre --package-root "$env:V4_IFX_COMPOSED/package" --target-root $env:GITHUB_WORKSPACE --state-root $env:V4_IFX_STATE --evidence-root $env:V4_IFX_EVIDENCE --profile ifx_profile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run trusted IFX Post with dependencies
        shell: pwsh
        run: |
          dotnet "$env:V4_IFX_COMPOSED/host/v4-guards.dll" stage run --stage post --with-dependencies --package-root "$env:V4_IFX_COMPOSED/package" --target-root $env:GITHUB_WORKSPACE --state-root $env:V4_IFX_STATE --evidence-root $env:V4_IFX_EVIDENCE --profile ifx_profile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-ifx-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v4-ifx-evidence
            ${{ runner.temp }}/v4-ifx-production.json
          if-no-files-found: error

  v4-ifx-required:
    name: v4-ifx-required
    if: always()
    needs: [v4-ifx-contract, v4-ifx-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Materialize the previously trusted base
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/ifx-trusted-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Aggregate from the trusted base
        shell: pwsh
        env:
          CONTRACT_RESULT: ${{ needs.v4-ifx-contract.result }}
          WINDOWS_RESULT: ${{ needs.v4-ifx-windows.result }}
        run: |
          pwsh -NoProfile -File "$env:RUNNER_TEMP/ifx-trusted-base/docs/guards/v4-adoption/ci/Invoke-IFXV4Aggregate.ps1" -ContractResult $env:CONTRACT_RESULT -WindowsResult $env:WINDOWS_RESULT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
