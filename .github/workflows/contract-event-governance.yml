name: Contract Event Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  g03-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate catalog, source, snapshots, waivers, and LayerGuard handoff
        shell: pwsh
        run: ./scripts/Invoke-G03ContractEventGuard.ps1 -Phase 7 -ReportPath artifacts/g03/governance.json
      - name: Run LayerGuard
        shell: pwsh
        run: ./scripts/Invoke-LayerGuard.ps1 -ReportPath artifacts/g03/layerguard.json
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g03-contract-event-governance
          path: artifacts/g03
          if-no-files-found: error
