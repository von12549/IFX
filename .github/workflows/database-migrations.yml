name: Database migration artifacts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migration-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.11
      - name: Restore solution
        run: dotnet restore IFX.sln
      - name: Build solution
        run: dotnet build IFX.sln --configuration Release --no-restore
      - name: Reject pending EF model changes
        shell: pwsh
        run: ./scripts/Test-DatabasePendingModelChanges.ps1 -NoBuild
      - name: Generate version-matched idempotent SQL
        shell: pwsh
        run: ./scripts/New-DatabaseMigrationArtifacts.ps1 -OutputDirectory artifacts/database-migrator/release -NoBuild
      - name: Enforce destructive migration review policy
        shell: pwsh
        run: ./scripts/Test-MigrationSafetyPolicy.ps1 -NoBuild
      - name: Publish DatabaseMigrator
        run: dotnet publish src/DatabaseMigrator/IFX.DatabaseMigrator/IFX.DatabaseMigrator.csproj --configuration Release --no-restore --output artifacts/database-migrator/publish /p:UseAppHost=false
      - name: Verify deterministic database boundary rules
        run: dotnet test tests/IFX.DatabaseBoundary.Tests/IFX.DatabaseBoundary.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~SqlServerMigrationMatrixTests"
      - name: Run SQL Server migration matrix
        run: dotnet test tests/IFX.DatabaseBoundary.Tests/IFX.DatabaseBoundary.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SqlServerMigrationMatrixTests"
      - name: Upload immutable migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: database-migrator-${{ github.sha }}
          path: artifacts/database-migrator
          if-no-files-found: error
