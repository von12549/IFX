name: LayerGuard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run deterministic 03-A0 gate
        shell: pwsh
        run: ./scripts/Invoke-LayerGuard.ps1 -ReportPath artifacts/layerguard/b0.5-ci.json
      - name: Upload LayerGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layerguard-b0.5
          path: artifacts/layerguard/b0.5-ci.json
          if-no-files-found: warn
