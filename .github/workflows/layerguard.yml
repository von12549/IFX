name: LayerGuard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

jobs:
  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate Plan 00 prerequisite release semantics
        shell: pwsh
        run: ./scripts/Test-Plan00PrerequisiteRelease.ps1 -ReportPath artifacts/plan00/prerequisite-release.json
      - name: Reconcile G03 catalog and generated LayerGuard input
        shell: pwsh
        run: ./scripts/Invoke-G03ContractEventGuard.ps1 -Phase 7 -ReportPath artifacts/layerguard/g03-policy-input.json
      - name: Revalidate immutable 03-A1 acceptance evidence
        shell: pwsh
        run: ./scripts/Test-03A1PolicyBinding.ps1 -StatusPath artifacts/layerguard/03-a1-status.json
      - name: Run current Plan 05 strict policy gate
        shell: pwsh
        run: ./scripts/Invoke-LayerGuard.ps1 -ReportPath artifacts/layerguard/b4-ci.json
      - name: Validate preserved Plan 03 B4 historical closure
        shell: pwsh
        run: ./scripts/Test-Plan03B4StrictClosure.ps1 -StatusPath artifacts/layerguard/plan03-b4-status.json
      - name: Check Plan 05 security boundaries and negative detector cases
        shell: pwsh
        run: ./scripts/Test-Plan05SecurityBoundary.ps1 -ReportPath artifacts/layerguard/plan05-security.json
      - name: Upload LayerGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layerguard-b4-strict
          path: artifacts/layerguard
          if-no-files-found: warn
      - name: Upload Plan 00 prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan00-prerequisite-release
          path: artifacts/plan00/prerequisite-release.json
          if-no-files-found: error
