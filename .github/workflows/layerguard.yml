name: LayerGuard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate Plan 00 prerequisite release semantics
        shell: pwsh
        run: ./scripts/Test-Plan00PrerequisiteRelease.ps1 -ReportPath artifacts/plan00/prerequisite-release.json
      - name: Reconcile G03 catalog and generated LayerGuard input
        shell: pwsh
        run: ./scripts/Invoke-G03ContractEventGuard.ps1 -Phase 7 -ReportPath artifacts/layerguard/g03-policy-input.json
      - name: Revalidate immutable 03-A1 acceptance evidence
        shell: pwsh
        run: ./scripts/Test-03A1PolicyBinding.ps1 -StatusPath artifacts/layerguard/03-a1-status.json
      - name: Run current B2 policy gate
        shell: pwsh
        run: ./scripts/Invoke-LayerGuard.ps1 -ReportPath artifacts/layerguard/b2-ci.json
      - name: Validate Plan 01 B2 evidence and milestone boundaries
        shell: pwsh
        run: ./scripts/Test-Plan01B2Evidence.ps1 -LayerGuardReportPath artifacts/layerguard/b2-ci.json -StatusPath artifacts/layerguard/plan01-b2-status.json
      - name: Upload LayerGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layerguard-b2
          path: artifacts/layerguard
          if-no-files-found: warn
      - name: Upload Plan 00 prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan00-prerequisite-release
          path: artifacts/plan00/prerequisite-release.json
          if-no-files-found: error
