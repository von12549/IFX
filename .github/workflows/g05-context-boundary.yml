name: G05 Context and Sensitive Data Boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  context-sensitive-data-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate context, schemas, sensitive data, runtime propagation, and architecture
        shell: pwsh
        run: ./scripts/Invoke-G05Verification.ps1
      - name: Upload G05 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g05-context-sensitive-data-boundary
          path: artifacts/g05
          if-no-files-found: error
