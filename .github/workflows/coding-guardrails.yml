name: Coding Guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check generated guard documents
        shell: pwsh
        run: ./scripts/guards/Invoke-GuardRegeneration.ps1 -Mode Check
      - name: Test guard framework and portable template
        shell: pwsh
        run: ./tests/guards/Test-CodingGuards.ps1
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/guards/Invoke-CodingGuard.ps1 -Stage Diff -BaseRef $env:GUARD_BASE -HeadRef $env:GUARD_HEAD
      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-guardrails-linux
          path: artifacts/guards
          if-no-files-found: warn

  framework-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check generated guard documents on Windows
        shell: pwsh
        run: ./scripts/guards/Invoke-GuardRegeneration.ps1 -Mode Check
      - name: Test guard framework on Windows
        shell: pwsh
        run: ./tests/guards/Test-CodingGuards.ps1
      - name: Check pull request diff on Windows
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/guards/Invoke-CodingGuard.ps1 -Stage Diff -BaseRef $env:GUARD_BASE -HeadRef $env:GUARD_HEAD
      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-guardrails-windows
          path: artifacts/guards
          if-no-files-found: warn

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/IFX.FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Frontend/IFX.FrontEnd/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test:run
      - name: Build frontend
        run: npm run build

  assembly-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution for compiled architecture check
        run: dotnet restore IFX.sln
      - name: Build solution for compiled architecture check
        run: dotnet build IFX.sln --configuration Release --no-restore
      - name: Test compiled architecture detector
        shell: pwsh
        run: ./tests/guards/Test-DomainAssemblyGuard.ps1
      - name: Check compiled Domain references
        shell: pwsh
        run: ./scripts/guards/Invoke-DomainAssemblyGuard.ps1 -Configuration Release -ReportPath artifacts/guards/domain-assembly-ci.json
      - name: Upload compiled architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-guardrails-domain-assemblies
          path: artifacts/guards/domain-assembly-ci.json
          if-no-files-found: warn
