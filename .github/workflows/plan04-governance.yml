name: Plan 04 governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  module-boundary-and-tenant-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Run unified Plan 04 fail-closed validation
        shell: pwsh
        run: ./scripts/Test-Plan04Governance.ps1 -StatusPath artifacts/plan04/phase6-governance-status.json
      - name: Validate Plan 04 bilingual design, diagrams, mappings, and honest closure
        shell: pwsh
        run: ./scripts/Test-Plan04Documentation.ps1 -StatusPath artifacts/plan04/phase8-documentation-status.json
      - name: Upload Plan 04 machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan04-governance
          path: |
            artifacts/plan04
            docs/architecture/review/evidence/plan04/*.json
          if-no-files-found: error
