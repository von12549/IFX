version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123
      - MSSQL_PID=Developer
    ports:
      - "11433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123' -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - auth-network

  auth-api:
    build:
      context: .
      dockerfile: src/ApiHost/AuthSamples.ApiHost/Dockerfile
    container_name: auth-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuthDatabase=Server=sqlserver,1433;Database=AuthSamplesDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;MultipleActiveResultSets=true
      - CognitoSettings__UserPoolId=${COGNITO_USER_POOL_ID}
      - CognitoSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoSettings__Region=${COGNITO_REGION}
      - CognitoOidcSettings__Domain=${COGNITO_OIDC_DOMAIN}
      - CognitoOidcSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoOidcSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoOidcSettings__CallbackUrl=${COGNITO_OIDC_CALLBACK_URL}
      - CognitoOidcSettings__LogoutCallbackUrl=${COGNITO_OIDC_LOGOUT_CALLBACK_URL}
      - CognitoOidcSettings__FrontendCallbackUrl=${COGNITO_OIDC_FRONTEND_CALLBACK_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    ports:
      - "5000:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local

networks:
  auth-network:
    driver: bridge
