services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ifx-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong@Pass123}
      - MSSQL_PID=Developer
    ports:
      - "11433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-YourStrong@Pass123}' -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ifx-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: ifx-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-YourStrong@Pass123}
    volumes:
      - ./docker/init-databases.sql:/init-databases.sql:ro
    command: /bin/bash -c '/opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$${DB_PASSWORD}" -i /init-databases.sql -C'
    networks:
      - ifx-network
    restart: "no"

  ifx-database-migrator:
    build:
      context: .
      dockerfile: src/DatabaseMigrator/IFX.DatabaseMigrator/Dockerfile
    container_name: ifx-database-migrator
    environment:
      - ConnectionStrings__AuthDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${MIGRATION_DB_USER:-sa};Password=${MIGRATION_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__CrmDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${MIGRATION_DB_USER:-sa};Password=${MIGRATION_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__RegistryDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${MIGRATION_DB_USER:-sa};Password=${MIGRATION_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__HoldingsDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${MIGRATION_DB_USER:-sa};Password=${MIGRATION_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__TransactionDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${MIGRATION_DB_USER:-sa};Password=${MIGRATION_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
    volumes:
      - migration_reports:/reports
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - ifx-network
    restart: "no"

  opa:
    image: openpolicyagent/opa:0.70.0-static
    container_name: ifx-opa
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level", "info", "/policies"]
    restart: on-failure
    networks:
      - ifx-network

  ifx-api:
    build:
      context: .
      dockerfile: src/ApiHost/IFX.ApiHost/Dockerfile
    container_name: IFX-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Runtime__Role=api
      # Database connections
      - ConnectionStrings__AuthDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__BackgroundJobsDatabase=Server=sqlserver,1433;Database=BackgroundJobsDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__CrmDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__HoldingsDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__TransactionDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__RegistryDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      # Identity Provider Selection
      - Authentication__Provider=${AUTHENTICATION_PROVIDER:-Cognito}
      # AWS Cognito
      - CognitoSettings__UserPoolId=${COGNITO_USER_POOL_ID}
      - CognitoSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoSettings__Region=${COGNITO_REGION:-ap-southeast-2}
      # Cognito OIDC
      - CognitoOidcSettings__Domain=${COGNITO_OIDC_DOMAIN}
      - CognitoOidcSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoOidcSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoOidcSettings__CallbackUrl=${COGNITO_OIDC_CALLBACK_URL:-http://localhost:5010/api/v1/auth/oauth/callback}
      - CognitoOidcSettings__LogoutCallbackUrl=${COGNITO_OIDC_LOGOUT_CALLBACK_URL:-http://localhost:5010/api/v1/auth/oauth/logout-callback}
      - CognitoOidcSettings__FrontendCallbackUrl=${COGNITO_OIDC_FRONTEND_CALLBACK_URL:-http://localhost:8030/callback}
      # AWS credentials
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      # Background Jobs (Hangfire)
      - BackgroundJobs__EnableDashboard=false
      - BackgroundJobs__WorkerCount=${HANGFIRE_WORKER_COUNT:-4}
      - BackgroundJobs__ServerName=${HANGFIRE_SERVER_NAME:-auth-api-worker}
      - BackgroundJobs__Queues__0=${HANGFIRE_QUEUE_0:-default}
      - BackgroundJobs__Queues__1=${HANGFIRE_QUEUE_1:-email}
      - BackgroundJobs__Queues__2=${HANGFIRE_QUEUE_2:-report}
      # Notifications (SendGrid) - optional, uses NoOp if not configured
      - Notifications__SendGrid__ApiKey=${SENDGRID_API_KEY:-}
      - Notifications__SendGrid__DefaultFromEmail=${SENDGRID_FROM_EMAIL:-noreply@clients.cx}
      - Notifications__SendGrid__DefaultFromName=${SENDGRID_FROM_NAME:-IFX}
      # Email Verification
      - EmailVerification__TokenValidityMinutes=${EMAIL_VERIFICATION_TOKEN_VALIDITY:-60}
      - EmailVerification__MaxResendsPerHour=${EMAIL_VERIFICATION_MAX_RESENDS:-3}
      - EmailVerification__VerificationBaseUrl=${EMAIL_VERIFICATION_BASE_URL:-http://localhost:5010/api/v1/auth/email/verify}
      # OPA Authorization
      - Opa__BaseUrl=${OPA_BASE_URL:-http://opa:8181}
      - Opa__TimeoutSeconds=${OPA_TIMEOUT_SECONDS:-5}
      - Opa__Enabled=${OPA_ENABLED:-true}
      - Opa__FailClosed=${OPA_FAIL_CLOSED:-true}
    ports:
      - "5010:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      ifx-database-migrator:
        condition: service_completed_successfully
      opa:
        condition: service_started
    networks:
      - ifx-network
    restart: unless-stopped

  ifx-worker:
    build:
      context: .
      dockerfile: src/ApiHost/IFX.ApiHost/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Runtime__Role=worker
      - ConnectionStrings__AuthDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__BackgroundJobsDatabase=Server=sqlserver,1433;Database=BackgroundJobsDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__CrmDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__HoldingsDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__TransactionDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__RegistryDatabase=Server=sqlserver,1433;Database=IFXDb;User Id=${RUNTIME_DB_USER:-sa};Password=${RUNTIME_DB_PASSWORD:-YourStrong@Pass123};TrustServerCertificate=True;MultipleActiveResultSets=true
      - Authentication__Provider=${AUTHENTICATION_PROVIDER:-Cognito}
      - CognitoSettings__UserPoolId=${COGNITO_USER_POOL_ID}
      - CognitoSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoSettings__Region=${COGNITO_REGION:-ap-southeast-2}
      - CognitoOidcSettings__Domain=${COGNITO_OIDC_DOMAIN}
      - CognitoOidcSettings__ClientId=${COGNITO_CLIENT_ID}
      - CognitoOidcSettings__ClientSecret=${COGNITO_CLIENT_SECRET}
      - CognitoOidcSettings__CallbackUrl=${COGNITO_OIDC_CALLBACK_URL:-http://localhost:5010/api/v1/auth/oauth/callback}
      - CognitoOidcSettings__LogoutCallbackUrl=${COGNITO_OIDC_LOGOUT_CALLBACK_URL:-http://localhost:5010/api/v1/auth/oauth/logout-callback}
      - CognitoOidcSettings__FrontendCallbackUrl=${COGNITO_OIDC_FRONTEND_CALLBACK_URL:-http://localhost:8030/callback}
      - BackgroundJobs__EnableDashboard=true
      - BackgroundJobs__WorkerCount=${HANGFIRE_WORKER_COUNT:-4}
      - BackgroundJobs__Queues__0=${HANGFIRE_QUEUE_0:-default}
      - BackgroundJobs__Queues__1=${HANGFIRE_QUEUE_1:-email}
      - BackgroundJobs__Queues__2=${HANGFIRE_QUEUE_2:-report}
      - Notifications__SendGrid__ApiKey=${SENDGRID_API_KEY:-}
      - Opa__BaseUrl=${OPA_BASE_URL:-http://opa:8181}
      - Opa__Enabled=${OPA_ENABLED:-true}
      - Opa__FailClosed=${OPA_FAIL_CLOSED:-true}
    depends_on:
      ifx-database-migrator:
        condition: service_completed_successfully
      opa:
        condition: service_started
    networks:
      - ifx-network
    restart: unless-stopped

  ifx-frontend:
    build:
      context: src/Frontend/IFX.FrontEnd
      dockerfile: Dockerfile.dev
    container_name: ifx-frontend
    ports:
      - "8030:8030"
    volumes:
      - ./src/Frontend/IFX.FrontEnd/src:/app/src
      - ./src/Frontend/IFX.FrontEnd/public:/app/public
      - ./src/Frontend/IFX.FrontEnd/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:5010
    depends_on:
      ifx-api:
        condition: service_started
    networks:
      - ifx-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
  migration_reports:
    driver: local

networks:
  ifx-network:
    driver: bridge
