  v3-specialized-database:
    name: v3-specialized-database
    needs: [v3-architecture, v3-quality-solution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: @@DOTNET_VERSION@@
      - name: Cache reviewed guard packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: guard-nuget-${{ runner.os }}-${{ hashFiles('docs/guards/*/build/locks/*.packages.lock.json') }}
          restore-keys: guard-nuget-${{ runner.os }}-
      - name: Restore EF Core CLI
        run: dotnet tool restore
      - name: Prepare trusted base worktree
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
