    name: v3-quality-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: @@NODE_VERSION@@
          cache: npm
          cache-dependency-path: src/Frontend/IFX.FrontEnd/package-lock.json
      - name: Prepare trusted base worktree
