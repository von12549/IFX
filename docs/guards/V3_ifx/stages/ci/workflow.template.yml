  v3-cross-platform:
    name: v3-cross-platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: @@DOTNET_VERSION@@
      - name: Prepare trusted base worktree
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/guard-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "GUARD_BASE=$env:RUNNER_TEMP/guard-base" >> $env:GITHUB_ENV
          "GUARD_BASE_SHA=$env:BASE_SHA" >> $env:GITHUB_ENV
          "GUARD_HEAD_SHA=$env:HEAD_SHA" >> $env:GITHUB_ENV
      - name: Cache reviewed guard packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: guard-nuget-${{ runner.os }}-${{ hashFiles('docs/guards/*/build/locks/*.packages.lock.json') }}
          restore-keys: guard-nuget-${{ runner.os }}-
      - name: Classify the verified changed set from the trusted base
        id: scope
        if: github.event_name == 'pull_request'
        # A base that cannot classify, or any failure here, leaves the scope empty, and every step below then runs.
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GUARD_BASE/docs/guards/V3_ifx/commands/Invoke-IFXGuardrails.ps1" -TrustedBase -TargetRoot $env:GITHUB_WORKSPACE -BaseSha $env:GUARD_BASE_SHA -Mode Scope -HeadRef $env:GUARD_HEAD_SHA -GitHubOutput $env:GITHUB_OUTPUT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate from the trusted base
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GUARD_BASE/docs/guards/V3_ifx/commands/Invoke-IFXGuardrails.ps1" -TrustedBase -TargetRoot $env:GITHUB_WORKSPACE -BaseSha $env:GUARD_BASE_SHA -Mode Validate -HeadRef $env:GUARD_HEAD_SHA -GateId v3-cross-platform-${{ matrix.os }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify trusted component candidates
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          # Activation is read from the base commit, so a PR cannot switch this verification off for itself (Plan 06 §11.6, D19).
          $declaration = (git show "$($env:GUARD_BASE_SHA):docs/guards/V3_ifx/stages/ci/required-checks.json") -join "`n" | ConvertFrom-Json
          $trusted = if ($declaration.PSObject.Properties.Name -contains 'trustedBase') { $declaration.trustedBase } else { $null }
          if ($null -eq $trusted -or $trusted.tcbCandidateVerification -ne 'active') {
            Write-Host 'Trusted component candidate verification is not active in the base commit (first introduction, Plan 06 §11.6).'
            exit 0
          }
          pwsh -NoProfile -File "$env:GUARD_BASE/docs/guards/V3_ifx/commands/Invoke-IFXGuardrails.ps1" -Mode TrustedComponentCandidate -TargetRoot $env:GITHUB_WORKSPACE -BaseSha $env:GUARD_BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reproduce head generated inputs and run head candidate tests
        if: steps.scope.outputs.scope != 'records-and-plans'
        shell: pwsh
        run: |
          $generation = Join-Path $env:RUNNER_TEMP 'v3-ifx-generation'
          New-Item -ItemType Directory -Force -Path $generation | Out-Null
          pwsh -NoProfile -File "./docs/guards/V3_ifx/commands/Invoke-IFXGuardrails.ps1" -Mode CandidateTests -CandidateSuite CrossPlatform -TargetRoot $env:GITHUB_WORKSPACE -GenerationRoot $generation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-cross-platform-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/guards/v3-ifx
          if-no-files-found: warn
