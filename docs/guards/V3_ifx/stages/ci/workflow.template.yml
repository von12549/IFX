          "GUARD_HEAD_SHA=$env:HEAD_SHA" >> $env:GITHUB_ENV
      - name: Run npm ci, lint, tests and build
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GUARD_BASE/docs/guards/V3_ifx/commands/Invoke-IFXGuardrails.ps1" -TrustedBase -TargetRoot $env:GITHUB_WORKSPACE -BaseSha $env:GUARD_BASE_SHA -Mode Quality -QualityTarget Frontend -GateId v3-quality-frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-quality-frontend-${{ github.sha }}
          path: artifacts/guards/v3-ifx
          if-no-files-found: error

