    "compatibility": {
      "Compatible": ["add optional field with a C# construction default", "add documented enum value with consumer fallback", "documentation clarification with no semantic change"],
      "Conditional": ["tighten validation within an already documented range", "change freshness or timeout within an approved consumer envelope", "optional field whose consumer fallback needs explicit evidence"],
      "Breaking": ["remove or rename field", "change field type or meaning", "make optional field required", "break interface signature", "change stable error code", "change event fact or occurrence time"],
      "Internal": ["implementation-only change outside the public schema and observable protocol"]
    },
    "dtoPolicy": {
      "optionalConstruction": "New optional members require a source-compatible default and must not break positional construction.",
      "unknownFields": "Consumers must ignore unknown fields while preserving known-field semantics.",
      "unknownValues": "Public status/enum values require an explicit Unknown fallback or a tested safe rejection policy."
    },
    "breakingChange": {
      "requiresParallelMajor": true,
      "sequence": ["publish V+1 beside V", "deploy consumers able to select V+1", "observe both versions", "migrate all consumers", "satisfy deprecation policy", "retire V without identity reuse"],
      "rollback": "Keep V and the consumer adapter switch point; do not delete produced V+1 messages or hide their processing owner."
    },
    "baseline": {
      "legacyCutover": "Plans 01/02 may atomically migrate in-repository producer and consumers because Abstractions is not a formal compatibility baseline.",
