<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">Deferred Write command flow</title><desc id="desc">A failure discards changes while success starts a short persistence transaction and dispatches after commit.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker><style>.b{fill:#f5f7fa;stroke:#334e68;stroke-width:2}.g{fill:#edf9f0;stroke:#2f855a;stroke-width:2}.r{fill:#fff5f5;stroke:#c53030;stroke-width:2}.d{fill:#fffbea;stroke:#b7791f;stroke-width:2}.t{font:14px Segoe UI,Arial;fill:#102a43;text-anchor:middle}.s{font:12px Segoe UI,Arial;fill:#486581;text-anchor:middle}.l{stroke:#52606d;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1080" height="330" fill="#fff"/>
  <g><rect class="b" x="25" y="45" width="120" height="55" rx="8"/><text class="t" x="85" y="77">Logging</text><rect class="b" x="180" y="45" width="120" height="55" rx="8"/><text class="t" x="240" y="77">Validation</text><rect class="b" x="335" y="45" width="145" height="55" rx="8"/><text class="t" x="407" y="68">Resolve one</text><text class="t" x="407" y="86">executor</text><rect class="b" x="515" y="45" width="120" height="55" rx="8"/><text class="t" x="575" y="77">Handler</text><polygon class="d" points="700,35 770,72 700,109 630,72"/><text class="t" x="700" y="68">Success?</text></g>
  <rect class="r" x="625" y="195" width="150" height="60" rx="8"/><text class="t" x="700" y="220">Discard changes</text><text class="s" x="700" y="240">no save</text>
  <rect class="g" x="820" y="45" width="120" height="55" rx="8"/><text class="t" x="880" y="67">Begin + prepare</text><text class="t" x="880" y="85">+ save once</text>
  <rect class="g" x="820" y="195" width="120" height="60" rx="8"/><text class="t" x="880" y="220">Commit</text><text class="s" x="880" y="240">local transaction</text>
  <rect class="g" x="965" y="195" width="90" height="60" rx="8"/><text class="t" x="1010" y="220">Dispatch</text><text class="s" x="1010" y="240">after commit</text>
  <line class="l" x1="145" y1="72" x2="180" y2="72"/><line class="l" x1="300" y1="72" x2="335" y2="72"/><line class="l" x1="480" y1="72" x2="515" y2="72"/><line class="l" x1="635" y1="72" x2="630" y2="72"/>
  <line class="l" x1="770" y1="72" x2="820" y2="72"/><text class="s" x="792" y="58">yes</text><line class="l" x1="700" y1="109" x2="700" y2="195"/><text class="s" x="716" y="155">no</text><line class="l" x1="880" y1="100" x2="880" y2="195"/><line class="l" x1="940" y1="225" x2="965" y2="225"/>
</svg>
