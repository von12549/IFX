<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Inbox consumer transaction flow</title><desc id="desc">Inbound metadata enters one local transaction; duplicates no-op and successful new events record completion before commit and acknowledgement.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker><style>.b{fill:#f5f7fa;stroke:#334e68;stroke-width:2}.g{fill:#edf9f0;stroke:#2f855a;stroke-width:2}.r{fill:#fff5f5;stroke:#c53030;stroke-width:2}.d{fill:#fffbea;stroke:#b7791f;stroke-width:2}.t{font:14px Segoe UI,Arial;fill:#102a43;text-anchor:middle}.s{font:12px Segoe UI,Arial;fill:#486581;text-anchor:middle}.l{stroke:#52606d;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="350" fill="#fff"/>
  <rect class="b" x="20" y="45" width="115" height="55" rx="8"/><text class="t" x="77" y="77">Transport</text><rect class="b" x="170" y="45" width="150" height="55" rx="8"/><text class="t" x="245" y="68">Inbound adapter</text><text class="s" x="245" y="87">metadata</text><rect class="b" x="355" y="45" width="140" height="55" rx="8"/><text class="t" x="425" y="77">Inbox command</text><rect class="g" x="530" y="45" width="130" height="55" rx="8"/><text class="t" x="595" y="68">Begin local</text><text class="t" x="595" y="86">transaction</text><polygon class="d" points="750,32 835,72 750,112 665,72"/><text class="t" x="750" y="68">Duplicate?</text>
  <rect class="b" x="685" y="190" width="130" height="55" rx="8"/><text class="t" x="750" y="222">No-op</text><rect class="g" x="870" y="45" width="135" height="55" rx="8"/><text class="t" x="937" y="77">Handler</text><rect class="g" x="870" y="190" width="135" height="55" rx="8"/><text class="t" x="937" y="213">Add completion</text><text class="s" x="937" y="232">then save once</text><rect class="g" x="530" y="275" width="130" height="55" rx="8"/><text class="t" x="595" y="299">Commit</text><text class="s" x="595" y="318">then ack</text><rect class="r" x="870" y="275" width="135" height="55" rx="8"/><text class="t" x="937" y="299">Failure</text><text class="s" x="937" y="318">rollback, no ack</text>
  <line class="l" x1="135" y1="72" x2="170" y2="72"/><line class="l" x1="320" y1="72" x2="355" y2="72"/><line class="l" x1="495" y1="72" x2="530" y2="72"/><line class="l" x1="660" y1="72" x2="665" y2="72"/><line class="l" x1="835" y1="72" x2="870" y2="72"/><text class="s" x="850" y="58">new</text><line class="l" x1="750" y1="112" x2="750" y2="190"/><text class="s" x="768" y="153">yes</text><line class="l" x1="937" y1="100" x2="937" y2="190"/><path class="l" d="M870 217 H595 V275"/><path class="l" d="M750 245 V260 H595 V275"/><line class="l" x1="937" y1="245" x2="937" y2="275"/>
</svg>
