<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Transaction failure state model</title><desc id="desc">Result failure discards, exceptions roll back, transient persistence may retry, and commit failure creates an unknown outcome requiring reconciliation.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker><style>.b{fill:#f5f7fa;stroke:#334e68;stroke-width:2}.g{fill:#edf9f0;stroke:#2f855a;stroke-width:2}.r{fill:#fff5f5;stroke:#c53030;stroke-width:2}.y{fill:#fffbea;stroke:#b7791f;stroke-width:2}.t{font:14px Segoe UI,Arial;fill:#102a43;text-anchor:middle}.s{font:12px Segoe UI,Arial;fill:#486581;text-anchor:middle}.l{stroke:#52606d;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1080" height="430" fill="#fff"/>
  <rect class="b" x="45" y="50" width="150" height="60" rx="24"/><text class="t" x="120" y="84">Handler</text><rect class="b" x="285" y="50" width="150" height="60" rx="24"/><text class="t" x="360" y="84">Persisting</text><rect class="g" x="525" y="50" width="150" height="60" rx="24"/><text class="t" x="600" y="84">Committed</text><rect class="y" x="285" y="185" width="150" height="60" rx="24"/><text class="t" x="360" y="219">Retried</text><rect class="r" x="45" y="320" width="150" height="60" rx="24"/><text class="t" x="120" y="354">Discarded</text><rect class="r" x="285" y="320" width="150" height="60" rx="24"/><text class="t" x="360" y="354">Rolled back</text><rect class="y" x="525" y="320" width="150" height="60" rx="24"/><text class="t" x="600" y="347">Unknown outcome</text><text class="s" x="600" y="367">reconcile before retry</text><rect class="r" x="765" y="320" width="190" height="60" rx="24"/><text class="t" x="860" y="347">Cleanup diagnostic</text><text class="s" x="860" y="367">original error preserved</text>
  <line class="l" x1="195" y1="80" x2="285" y2="80"/><text class="s" x="240" y="65">success</text><line class="l" x1="435" y1="80" x2="525" y2="80"/><text class="s" x="480" y="65">commit ok</text><path class="l" d="M120 110 V320"/><text class="s" x="159" y="210">Result.Failure</text><path class="l" d="M170 110 L335 320"/><text class="s" x="255" y="230">exception / cancel</text><line class="l" x1="360" y1="110" x2="360" y2="185"/><text class="s" x="405" y="150">transient</text><path class="l" d="M435 215 H475 V105 H435"/><line class="l" x1="435" y1="92" x2="570" y2="320"/><text class="s" x="515" y="225">commit failed</text><line class="l" x1="435" y1="350" x2="765" y2="350"/><text class="s" x="610" y="337">rollback cleanup failed</text>
</svg>
