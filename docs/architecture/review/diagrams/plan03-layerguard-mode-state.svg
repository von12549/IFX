  <path d="M1125 435H1275V235" class="line"/><text x="1170" y="423" class="b">repair + rerun</text>
  <rect x="350" y="390" width="330" height="90" class="pending"/><text x="420" y="428" class="b">Approval pending (L7.7)</text><text x="395" y="453" class="b">architecture owner reviews B1 ↔ B4</text><path d="M1125 205L680 410" class="line"/>
  <rect x="50" y="390" width="220" height="90" class="strict"/><text x="115" y="428" class="b">Approved</text><text x="84" y="453" class="b">owner signature recorded</text><path d="M350 435H270" class="line"/>
</svg>
