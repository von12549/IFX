<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">LayerGuard migration to strict mode</title><desc id="desc">B0.5 through B4 and approval state.</desc><rect width="1500" height="620" fill="#08111f"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef7}.h{font-size:28px;font-weight:700}.b{font-size:15px}.state{fill:#13243b;stroke:#66d9ef;stroke-width:2;rx:28}.strict{fill:#17382f;stroke:#5ce1a2;stroke-width:3;rx:28}.fail{fill:#431e2b;stroke:#ff6b8a;stroke-width:2;rx:28}.pending{fill:#27304a;stroke:#f7c948;stroke-width:2;rx:28}.line{stroke:#9fb3c8;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9fb3c8"/></marker></defs>
  <text x="45" y="52" class="h">Plan 03 · migration-to-strict mode</text>
  <rect x="45" y="135" width="210" height="90" class="state"/><text x="98" y="173" class="b">Bootstrap B0.5</text><text x="85" y="198" class="b">engine + fixtures</text>
  <rect x="315" y="135" width="210" height="90" class="state"/><text x="360" y="173" class="b">Policy bound B1</text><text x="381" y="198" class="b">116 findings</text><path d="M255 180H315" class="line"/>
  <rect x="585" y="135" width="210" height="90" class="state"/><text x="620" y="173" class="b">Contracts B2</text><text x="651" y="198" class="b">103 findings</text><path d="M525 180H585" class="line"/>
  <rect x="855" y="135" width="210" height="90" class="state"/><text x="901" y="173" class="b">Events B3</text><text x="930" y="198" class="b">32 findings</text><path d="M795 180H855" class="line"/>
  <rect x="1125" y="125" width="300" height="110" class="strict"/><text x="1194" y="168" class="b">STRICT B4 · 0 findings</text><text x="1160" y="194" class="b">compatibility removed; empty baseline</text><text x="1197" y="218" class="b">all future findings block</text><path d="M1065 180H1125" class="line"/>
