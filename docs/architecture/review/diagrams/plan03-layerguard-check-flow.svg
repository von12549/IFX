  <polygon points="590,110 680,161 590,212 500,161" class="decision"/><text x="545" y="157" class="b">hashes valid</text><text x="577" y="180" class="b">?</text><path d="M495 161H500" class="line"/>
  <rect x="735" y="120" width="205" height="82" class="box"/><text x="770" y="154" class="b">Discover projects</text><text x="779" y="179" class="b">and ownership</text><path d="M680 161H735" class="line"/>
