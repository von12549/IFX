<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">LayerGuard B4 check flow</title><desc id="desc">Fail-closed path from Gate reconciliation through reports.</desc><rect width="1500" height="620" fill="#08111f"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef7}.h{font-size:28px;font-weight:700}.b{font-size:15px}.box{fill:#13243b;stroke:#66d9ef;stroke-width:2;rx:12}.decision{fill:#27304a;stroke:#f7c948;stroke-width:2}.fail{fill:#431e2b;stroke:#ff6b8a;stroke-width:2;rx:12}.ok{fill:#17382f;stroke:#5ce1a2;stroke-width:2;rx:12}.line{stroke:#9fb3c8;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9fb3c8"/></marker></defs>
